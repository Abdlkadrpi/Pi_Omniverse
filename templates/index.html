<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Omniverse Hub - Sovereign Gateway</title>
    <script src="https://sdk.minepi.com/pi-sdk.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-white p-4">
    <div class="max-w-md mx-auto bg-zinc-900 p-6 rounded-2xl border border-yellow-600 shadow-xl">
        <h1 class="text-2xl text-yellow-500 font-bold mb-2 text-center">OMNIVERSE HUB</h1>
        
        <!-- زر تبديل البيئة بين Testnet و Mainnet -->
        <div class="flex justify-center items-center gap-2 mb-4">
            <button id="envToggleBtn" onclick="toggleEnvironment()" class="text-xs px-3 py-1 rounded border border-yellow-600 bg-yellow-900/40 text-yellow-400 font-bold transition">
                Mode: TESTNET (Sandbox)
            </button>
        </div>

        <p class="text-xs text-center text-zinc-400 mb-6">منصة المدن الذكية والوكلاء الرقميين</p>
        
        <button id="authBtn" onclick="connectPi()" class="w-full bg-yellow-600 p-3 rounded-lg font-bold text-black mb-3 hover:bg-yellow-500 transition shadow-lg">CONNECT PI</button>
        
        <button onclick="forceResetPayments()" class="w-full bg-red-600 p-2 rounded-lg font-bold text-white mb-4 text-sm hover:bg-red-700 transition">🧹 SURGICAL RESET</button>

        <!-- قسم لتنفيذ المعاملات الخمس التجريبية تلقائياً لإلغاء التحذير الأحمر في منصة المطورين -->
        <div id="testnetHelperSection" class="mb-6 p-3 bg-zinc-800/80 rounded-xl border border-yellow-500/40">
            <h3 class="text-xs font-bold text-yellow-400 mb-2 text-center">⚙️ تسريع اجتياز شرط الـ 5 معاملات (Testnet)</h3>
            <button onclick="runFiveTestTransactions()" class="w-full bg-amber-600 hover:bg-amber-500 text-black font-bold p-2 rounded text-xs transition shadow">
                🚀 إطلاق 5 معاملات اختبارية متتالية
            </button>
            <p class="text-[10px] text-zinc-400 mt-1 text-center">يستخدم لتوليد معاملات SDK مقبولة للبلوكتشين وإزالة التحذير الأحمر.</p>
        </div>

        <div class="space-y-4 border-t border-zinc-800 pt-4">
            <h2 class="text-sm font-bold text-yellow-400">توثيق الأصول السيادية (RWA)</h2>
            <input id="assetName" placeholder="اسم الأصل (مثال: عقار ذكي رقم 01)" class="w-full bg-black p-3 border border-zinc-700 rounded text-white focus:border-yellow-500 outline-none">
            <input id="assetVal" type="number" step="0.01" placeholder="القيمة بـ Pi" class="w-full bg-black p-3 border border-zinc-700 rounded text-white focus:border-yellow-500 outline-none">
            <button onclick="processPayment()" class="w-full bg-blue-600 p-3 rounded-lg font-bold hover:bg-blue-500 transition shadow-lg">PAY & REGISTER</button>
        </div>

        <div class="mt-6 text-center">
            <p id="statusMsg" class="text-xs text-zinc-500"></p>
        </div>
    </div>

    <script>
        const API_BASE_URL = window.location.origin;  
        const CLIENT_ID = "gbq0kabvz0z4rerl2al5kvbrlwkrtr9a6zi5guf8n423hzxr46qsvvjuatggm2jb";
        let currentUser = null;

        let isSandbox = true;

        function initPiSDK() {
            Pi.init({ version: "2.0", sandbox: isSandbox, clientId: CLIENT_ID });
            const envBtn = document.getElementById('envToggleBtn');
            const helperSec = document.getElementById('testnetHelperSection');
            
            envBtn.innerText = isSandbox ? `Mode: TESTNET (Sandbox)` : `Mode: MAINNET (Production)`;
            envBtn.className = isSandbox 
                ? "text-xs px-3 py-1 rounded border border-yellow-600 bg-yellow-900/40 text-yellow-400 font-bold transition"
                : "text-xs px-3 py-1 rounded border border-green-600 bg-green-900/40 text-green-400 font-bold transition";
            
            // إظهار قسم المساعدة فقط في وضع Testnet
            if (helperSec) {
                helperSec.style.display = isSandbox ? "block" : "none";
            }
        }

        function toggleEnvironment() {
            isSandbox = !isSandbox;
            initPiSDK();
            alert(`تم الانتقال إلى وضع: ${isSandbox ? 'Testnet' : 'Mainnet'}`);
        }

        initPiSDK();

        async function connectPi() {
            try {
                const auth = await Pi.authenticate(['username', 'payments'], onIncompletePayment);
                currentUser = auth.user;
                document.getElementById('authBtn').innerText = "✅ " + currentUser.username;
            } catch (err) {  
                console.error("Auth Error:", err);
                alert("فشل الاتصال: تأكد من استخدام متصفح Pi.");
            }
        }

        function onIncompletePayment(payment) {
            console.log("Incomplete payment found:", payment.identifier);
            approvePaymentOnServer(payment.identifier);
        }

        async function approvePaymentOnServer(paymentId) {
            try {
                const response = await fetch(`${API_BASE_URL}/api/approve_payment`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ paymentId: paymentId, userId: currentUser ? currentUser.username : "unknown", sandbox: isSandbox })
                });
                return await response.json();
            } catch (err) {
                console.error("Approval Error:", err);
            }
        }

        function processPayment() {
            if (!currentUser) return alert("يرجى الضغط على CONNECT PI أولاً!");
            
            const name = document.getElementById('assetName').value;
            const val = parseFloat(document.getElementById('assetVal').value);

            if (!name || isNaN(val) || val <= 0) return alert("يرجى إدخال بيانات صحيحة للأصل والقيمة!");

            const paymentData = {
                amount: val,
                memo: `Registration: ${name}`,
                metadata: { asset: name, type: "Omniverse_RWA" }
            };

            const callbacks = {
                onReadyForServerApproval: async (paymentId) => {
                    await approvePaymentOnServer(paymentId);
                },
                onReadyForServerCompletion: async (paymentId, txid) => {
                    try {
                        const res = await fetch(`${API_BASE_URL}/api/complete_payment`, {
                            method: 'POST',
                            headers: {'Content-Type': 'application/json'},
                            body: JSON.stringify({ paymentId: paymentId, txid: txid, asset_name: name, asset_value: val, owner: currentUser.username, sandbox: isSandbox })
                        });
                        
                        if (res.ok) {
                            alert("تمت المعاملة وتوثيق الأصل بنجاح!");
                            document.getElementById('statusMsg').innerText = "تم تسجيل الأصل السيادي بنجاح.";
                        } else {
                            alert("خطأ في إتمام المعاملة على السيرفر.");
                        }
                    } catch (e) {
                        console.error("Completion fetch error:", e);
                    }
                },
                onCancel: (paymentId) => {
                    alert("تم إلغاء المعاملة من قِبل المستخدم.");
                },
                onError: (error, payment) => {
                    alert("خطأ في محفظة باي: " + (error.message || JSON.stringify(error)));
                }
            };

            Pi.createPayment(paymentData, callbacks);
        }

        // دالة مخصصة لتنفيذ 5 معاملات متتالية بسرعة لاجتياز فحص المنصة
        async function runFiveTestTransactions() {
            if (!currentUser) return alert("يرجى الضغط على CONNECT PI أولاً!");
            if (!confirm("سيتم البدء في سلسلة من المعاملات التجريبية (5 دفعات متتالية). هل أنت مستعد؟")) return;

            for (let i = 1; i <= 5; i++) {
                await new Promise((resolve) => {
                    const testData = {
                        amount: 0.1,
                        memo: `Test Milestone Verification #${i}`,
                        metadata: { type: "Milestone_Test", index: i }
                    };

                    const testCallbacks = {
                        onReadyForServerApproval: async (paymentId) => {
                            await approvePaymentOnServer(paymentId);
                        },
                        onReadyForServerCompletion: async (paymentId, txid) => {
                            await fetch(`${API_BASE_URL}/api/complete_payment`, {
                                method: 'POST',
                                headers: {'Content-Type': 'application/json'},
                                body: JSON.stringify({ paymentId: paymentId, txid: txid, asset_name: `Test Asset ${i}`, asset_value: 0.1, owner: currentUser.username, sandbox: isSandbox })
                            });
                            resolve();
                        },
                        onCancel: () => { resolve(); },
                        onError: () => { resolve(); }
                    };

                    try {
                        Pi.createPayment(testData, testCallbacks);
                    } catch(e) {
                        resolve();
                    }
                });
            }
            alert("تم الانتهاء من دورة المعاملات التجريبية. تحقق من منصة المطورين!");
        }

        async function forceResetPayments() {
            if(!confirm("هل أنت متأكد من تطهير المعاملات المعلقة؟")) return;
            try {
                await fetch(`${API_BASE_URL}/api/force_cancel_all`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ sandbox: isSandbox })
                });
                localStorage.clear();
                alert("تمت عملية التطهير بنجاح.");
            } catch(e) {
                alert("خطأ: " + e.message);
            }
        }
    </script>
</body>
</html>
