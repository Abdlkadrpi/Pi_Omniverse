<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>OMNIVERSE CORE - Dashboard</title>
    <script src="https://sdk.minepi.com/pi-sdk.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <style>
        body { background: #0a0a0a; color: #00ff41; font-family: 'Courier New', monospace; padding: 20px; }
        .container { max-width: 500px; margin: auto; border: 1px solid #00ff41; padding: 20px; border-radius: 8px; }
        input { width: 100%; padding: 10px; margin: 10px 0; background: #000; border: 1px solid #00ff41; color: #fff; }
        button { width: 100%; padding: 15px; background: #00ff41; border: none; cursor: pointer; font-weight: bold; }
        .status-green { color: #00ff41; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h2>OMNIVERSE NOTARY</h2>
    <div id="piUsername">User: Loading...</div>
    <input type="text" id="notaryInput" placeholder="أدخل محتوى التوثيق...">
    <button onclick="initPayment()">توقيع وتوثيق (Notarize)</button>
    <div id="msg" style="margin-top:20px;"></div>
</div>

<script>
    // استخدام window.location.origin لجلب رابط النفق الحالي تلقائياً
    const SERVER_URL = window.location.origin;

    async function initPayment() {
        const content = document.getElementById('notaryInput').value.trim();
        if (content.length < 3) return alert("أدخل نصاً صحيحاً!");

        try {
            Pi.createPayment({
                amount: 1.0,
                memo: "Omniverse Notarization",
                metadata: { asset: content }
            }, {
                onReadyForServerApproval: async (paymentId) => {
                    try {
                        const res = await axios.post(`${SERVER_URL}/api/notarize`, {
                            username: "User", 
                            content: content,
                            payment_id: paymentId
                        });
                        
                        if (res.data.status === "success") {
                            await Pi.approvePayment(paymentId);
                            alert("تم التوثيق بنجاح!");
                        }
                    } catch (e) {
                        alert("خطأ في الاتصال بالسيرفر: " + e.message);
                    }
                },
                onCancel: () => alert("تم إلغاء الدفع"),
                onError: (e) => alert("خطأ SDK: " + e)
            });
        } catch (e) {
            alert("فشل في التهيئة: " + e.message);
        }
    }

    // تهيئة SDK
    Pi.init({ version: "2.0" });
</script>
</body>
</html>
